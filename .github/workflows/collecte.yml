# Collecte automatique toutes les 6 heures vers la base Notion « Veille Synth ».
# Secrets à créer (Settings → Secrets and variables → Actions) :
#   NOTION_TOKEN, NOTION_DATABASE_ID,
#   INOREADER_APP_ID, INOREADER_APP_KEY, INOREADER_REFRESH_TOKEN,
#   OPENALEX_API_KEY (facultatif),
#   GH_SECRETS_PAT : jeton GitHub « fine-grained » limité à ce dépôt, permission
#     « Secrets : Read and write ». Sert uniquement à enregistrer le refresh_token
#     qu'Inoreader renouvelle à chaque connexion.
name: Collecte veille

# Deux collectes simultanées utiliseraient le même refresh_token, que la première invalide
concurrency:
  group: collecte
  cancel-in-progress: false

on:
  pull_request:          # sur PR : tests seulement, pas de collecte
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      depuis:
        description: "Nombre de jours en arrière"
        default: "2"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

  collecte:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collecte
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          INOREADER_APP_ID: ${{ secrets.INOREADER_APP_ID }}
          INOREADER_APP_KEY: ${{ secrets.INOREADER_APP_KEY }}
          INOREADER_REFRESH_TOKEN: ${{ secrets.INOREADER_REFRESH_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          INOREADER_NOUVEAU_JETON_FICHIER: ${{ runner.temp }}/inoreader_refresh_token
        run: |
          # Inoreader n'est lancé que si ses secrets existent
          SOURCES="openalex,arxiv,hal,socarxiv"
          if [ -n "$INOREADER_REFRESH_TOKEN" ]; then SOURCES="inoreader,$SOURCES"; fi
          python -m veille.collecte --sources "$SOURCES" --depuis "${{ inputs.depuis || '2' }}"

      - name: Mise à jour du jeton Inoreader
        # always() : le jeton a déjà tourné même si une autre source a échoué ensuite
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
          FICHIER: ${{ runner.temp }}/inoreader_refresh_token
        run: |
          if [ ! -s "$FICHIER" ]; then echo "Jeton Inoreader inchangé."; exit 0; fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Nouveau refresh_token Inoreader non enregistré : créer le secret GH_SECRETS_PAT (voir README)."
            exit 1
          fi
          gh secret set INOREADER_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$FICHIER"
          rm -f "$FICHIER"
          echo "Secret INOREADER_REFRESH_TOKEN mis à jour."

      - name: Radar de résonance
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python -m veille.radar --jours 7

      - name: Top de la semaine
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python -m veille.top -n 30
