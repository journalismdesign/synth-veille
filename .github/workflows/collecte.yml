# Collecte automatique toutes les 6 heures vers la base Notion « Veille Synth ».
# Secrets à créer (Settings → Secrets and variables → Actions) :
#   NOTION_TOKEN, NOTION_DATABASE_ID,
#   INOREADER_APP_ID, INOREADER_APP_KEY, INOREADER_REFRESH_TOKEN,
#   OPENALEX_API_KEY (facultatif)
name: Collecte veille

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      depuis:
        description: "Nombre de jours en arrière"
        default: "2"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

  collecte:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collecte
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          INOREADER_APP_ID: ${{ secrets.INOREADER_APP_ID }}
          INOREADER_APP_KEY: ${{ secrets.INOREADER_APP_KEY }}
          INOREADER_REFRESH_TOKEN: ${{ secrets.INOREADER_REFRESH_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          # Inoreader n'est lancé que si ses secrets existent
          SOURCES="openalex,arxiv,hal,socarxiv"
          if [ -n "$INOREADER_REFRESH_TOKEN" ]; then SOURCES="inoreader,$SOURCES"; fi
          python -m veille.collecte --sources "$SOURCES" --depuis "${{ inputs.depuis || '2' }}"
